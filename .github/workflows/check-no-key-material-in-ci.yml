name: Reject CI-generated key material pushed to Cloudflare

# Cloudflare pod-binding security addendum (BasalMind/marketing,
# docs/design-briefs/cloudflare-pod-binding-security-addendum.md) item 2.6:
# pod identity/DID-update keys must never exist on Cloudflare in any form.
# The addendum's own wording names "Cloudflare" as the thing to guard
# against, but doesn't name every route there -- the path of least
# resistance for someone extending this template is generating the pod's
# keypair as a CI step and `wrangler secret put`-ing it, which puts
# identity material on GitHub (workflow logs, runner memory) AND
# Cloudflare at once. This check closes that specific route: it fails if
# any workflow file both generates key material and pushes a secret to
# Cloudflare.
#
# Does NOT flag the endorsed pattern (a service key generated by the
# Worker's own runtime code, inside Cloudflare, non-extractable) -- that
# code lives in src/, is never a GitHub Actions command, and can never
# match this check's patterns.
#
# Runs on every push and pull_request, unlike setup-pod.yml's
# workflow_dispatch-only trigger -- this is a structural guardrail that
# must never silently stop running, not a deliberate customer action.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan workflows for key-generation + Cloudflare-secret combination
        run: |
          set -e
          KEYGEN_PATTERN='openssl genpkey|openssl ecparam|openssl req|ssh-keygen|generateKeyPair|generateKey\(|keyPair\('
          SELF_PATH=".github/workflows/check-no-key-material-in-ci.yml"
          violations=0
          shopt -s nullglob
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            # Skip this check's own file -- it necessarily mentions both
            # trigger patterns (in this very command) to define what it's
            # looking for, which would otherwise flag itself every run.
            [ "$f" = "$SELF_PATH" ] && continue
            if grep -qE "$KEYGEN_PATTERN" "$f" && grep -q 'wrangler secret put' "$f"; then
              echo "VIOLATION: $f generates key material AND pushes a Cloudflare secret in the same workflow"
              violations=1
            fi
          done
          if [ "$violations" -ne 0 ]; then
            echo ""
            echo "Pod identity/DID-update keys must never exist on Cloudflare in any form"
            echo "(security addendum item 2.6). Generate identity keys on the owner's own"
            echo "device instead, never in a CI workflow that also touches Cloudflare secrets."
            exit 1
          fi
          echo "No CI-generated key material pushed to Cloudflare secrets -- check passed."
